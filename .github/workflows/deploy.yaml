name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6 
      - name: deploy by SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST}}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/simple_backend_for_deploy
            git pull
            sudo docker compose down
            sudo docker compose up -d --build
